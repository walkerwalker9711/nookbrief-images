name: senior-tiktok
# 한국이장님 TikTok. A push that changes senior/tiktok/request runs each line in it:
# "link", "connect <code from callback.html>", or "upload <draft folder>" (sends it to the owner's TikTok inbox).
on:
  push:
    branches: [claude/project-thread-9sna6x]
    paths: [senior/tiktok/request]
permissions:
  contents: write
concurrency: {group: senior-tiktok, cancel-in-progress: false}
jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - name: Run request
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          grep -v '^#' senior/tiktok/request | grep -v '^\s*$' | while read -r line; do
            python scripts/senior/tiktok.py $line
          done
      - name: Save results
        if: always()
        run: |
          git config user.name "nookbrief-bot"
          git config user.email "nookbrief-bot@users.noreply.github.com"
          for f in senior/tiktok/login_link.txt senior/tiktok/token.enc senior/drafts/*/tiktok_result.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "senior: tiktok result [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done; exit 1
