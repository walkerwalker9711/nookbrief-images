name: social-list
# Manual, read-only: list the latest Instagram and Threads posts to check what is live.
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - working-directory: scripts/social
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python list_posts.py
      - working-directory: scripts/social
        run: python pin_check.py
      - working-directory: scripts/social
        run: python redirect_check.py
