name: senior-upload
# Uploads senior Shorts drafts the owner approved in the thread. Until this file is on main, a push that changes
# senior/uploads/request runs it (one draft folder per line, e.g. "senior/drafts/2026-10-26-kr").
on:
  workflow_dispatch:
    inputs:
      folder: {description: "draft folder, e.g. senior/drafts/2026-10-26-kr", required: true}
  push:
    branches: [claude/project-thread-9sna6x]
    paths: [senior/uploads/request]
permissions:
  contents: write
concurrency: {group: senior-upload, cancel-in-progress: false}
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          KR_YT_REFRESH_TOKEN: ${{ secrets.KR_YT_REFRESH_TOKEN }}
          US_YT_REFRESH_TOKEN: ${{ secrets.US_YT_REFRESH_TOKEN }}
          IN_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          if [ -n "$IN_FOLDER" ]; then folders="$IN_FOLDER"; else folders=$(grep -v '^#' senior/uploads/request | grep -v '^\s*$'); fi
          python scripts/senior/upload.py $folders
      - name: Save results
        if: always()
        run: |
          git config user.name "nookbrief-bot"
          git config user.email "nookbrief-bot@users.noreply.github.com"
          git add senior/drafts/*/upload_result.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "senior: upload result [skip ci]" && git pull --rebase && git push)
