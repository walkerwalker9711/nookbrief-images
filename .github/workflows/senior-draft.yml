name: senior-draft
# Weekday drafts for 한국이장님 (kr) and Pops Knows (us): script, pictures, voice and video in
# senior/drafts/<date>-<channel>/. Nothing is uploaded.
# The schedule and workflow_dispatch work once this file is on main; until then a push that changes
# senior/drafts/request runs it (one line per draft: "kr" or "kr 과태료 문자").
on:
  schedule:
    - cron: "0 22 * * 0-4"   # 07:00 KST Mon-Fri, after the 06:00 trend collection
  workflow_dispatch:
    inputs:
      channel: {description: "kr, us or both", default: both}
      topic: {description: "optional topic", default: ""}
  push:
    branches: [claude/project-thread-9sna6x]
    paths: [senior/drafts/request]
permissions:
  contents: write
concurrency: {group: senior-draft, cancel-in-progress: false}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_CHANNEL: ${{ github.event.inputs.channel }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ev = os.environ["EVENT"]
          if ev == "push":
              rows = [l.split(None, 1) for l in open("senior/drafts/request", encoding="utf-8").read().splitlines() if l.strip() and not l.startswith("#")]
              # "kr", "kr 과태료 문자", or "kr @2026-10-27 ..." to make the draft for another day's format;
              # "kr rerender" / "kr @2026-10-26 rerender" redo only voice and video of that day's draft (script and pictures are kept)
              jobs = []
              for r in rows:
                  rest = r[1] if len(r) > 1 else ""
                  rerender = "--rerender" if rest.split()[-1:] == ["rerender"] else ""
                  rest = rest[:-len("rerender")].strip() if rerender else rest
                  date = rest.split()[0][1:] if rest.startswith("@") else ""
                  jobs.append({"channel": r[0], "date": date, "rerender": rerender,
                               "topic": rest.split(None, 1)[1] if date and len(rest.split()) > 1 else ("" if date else rest)})
          elif ev == "workflow_dispatch":
              ch = os.environ["IN_CHANNEL"] or "both"
              jobs = [{"channel": c, "date": "", "topic": os.environ["IN_TOPIC"]} for c in (["kr", "us"] if ch == "both" else [ch])]
          else:
              jobs = [{"channel": "kr", "date": "", "topic": ""}, {"channel": "us", "date": "", "topic": ""}]
          print("jobs=" + json.dumps(jobs, ensure_ascii=False))
          PY
  draft:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd video && npm ci --no-audit --no-fund
      - timeout-minutes: 20
        run: |
          # Some runner images lack ffmpeg and both apt mirrors crawled on 10-26 (10+ minutes), so take
          # the ffmpeg build that ships in the imageio-ffmpeg wheel (has libass for the subtitles).
          if ! command -v ffmpeg; then
            pip install imageio-ffmpeg==0.6.0
            mkdir -p ~/bin && ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
            echo ~/bin >> "$GITHUB_PATH"
            ~/bin/ffmpeg -hide_banner -filters | grep -w subtitles
          fi
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/NotoSansCJKkr-Bold.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansCJKkr-Bold.otf
          fc-cache -f ~/.fonts && fc-list | grep -i "CJK KR"
          curl -fsSL -o ~/.fonts/NotoSansCJKkr-Black.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansCJKkr-Black.otf || true
          fc-cache -f ~/.fonts
          pip install requests==2.32.3 numpy==2.1.3
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CHANNEL: ${{ matrix.job.channel }}
          TOPIC: ${{ matrix.job.topic }}
          DATE: ${{ matrix.job.date }}
          RERENDER: ${{ matrix.job.rerender }}
        run: python scripts/senior/draft.py "$CHANNEL" --topic "$TOPIC" --date "$DATE" $RERENDER
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A senior/drafts senior/kr senior/us senior/voices.json
          git commit -m "senior: ${{ matrix.job.channel }} draft [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
