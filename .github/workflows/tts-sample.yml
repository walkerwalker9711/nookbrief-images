name: tts-sample
# On demand: render voice samples for the senior Shorts channels and commit them to senior/samples.
# workflow_dispatch only works once this file is on main; until then a push that touches
# senior/samples/request runs it on this branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-9sna6x]
    paths: [senior/samples/request]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python scripts/senior/tts_sample.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senior/samples
          git commit -m "senior: voice samples [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
