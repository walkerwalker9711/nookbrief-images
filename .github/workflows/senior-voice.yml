name: senior-voice
# Check the ElevenLabs key/voice and read 한국이장님 episode 1 into senior/samples/kr_ep1.mp3.
# workflow_dispatch works once this file is on main; until then a push touching senior/samples/el_request runs it.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-9sna6x]
    paths: [senior/samples/el_request]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - run: command -v ffmpeg || (pip install imageio-ffmpeg==0.6.0 && mkdir -p ~/bin && ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg && echo ~/bin >> "$GITHUB_PATH")
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p senior/samples
          # "music check" / "music make <id> ..." build the background music library (owner 10-29); the
          # make step stops before spending when fewer than 1,500 credits per track are left
          if grep -q '^music ' senior/samples/el_request; then
            python scripts/senior/music_library.py check | tee /tmp/credits.txt
            ids=$(grep '^music make' senior/samples/el_request | sed 's/^music make//')
            if [ -n "$ids" ]; then
              left=$(sed -n 's/.* left \([0-9-]*\).*/\1/p' /tmp/credits.txt)
              n=$(echo $ids | wc -w)
              if [ "${left:-0}" -lt $((n * 1500)) ]; then echo "not enough credits: $left for $n tracks" | tee senior/samples/music_credits.txt
              else python scripts/senior/music_library.py make $ids; mkdir -p docs/preview/music; cp video/music_lib/*.mp3 docs/preview/music/; fi
            fi
            cp /tmp/credits.txt senior/samples/music_credits_check.txt
            exit 0
          fi
          # a line "audition <channel> <role> <text>" makes candidate voices for a drama role instead (owner 10-28)
          if grep -q '^audition ' senior/samples/el_request; then
            grep '^audition ' senior/samples/el_request | while read _ ch role text; do python scripts/senior/voice_audition.py "$ch" "$role" "$text"; done
            exit 0
          fi
          python scripts/senior/el_voice.py kr --check
          python scripts/senior/el_voice.py kr "아, 아. 과태료 미납 문자 받으신 분, 누르지 마세요. 요즘 오는 사기 문자 절반 넘게가 이렇게 관공서 흉내입니다. 링크는 건드리지 말고, 문자를 꾹 눌러서 차단하고 신고. 그걸로 끝입니다. 진짜 벌금이 있는지는 이파인에 직접 들어가 보세요. 거기 없으면 없는 겁니다. 오늘 부모님 폰에도 하나 와 있을지 몰라요. 한번 열어봐 드리세요." senior/samples/kr_ep1.mp3
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senior/samples video/music_lib docs/preview/music 2>/dev/null || git add senior/samples
          git commit -m "senior: 한국이장님 episode 1 voice [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
