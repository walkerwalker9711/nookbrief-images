name: image-gen
# Draws open image work orders (orders/*.md) with the OpenAI Images API and pushes them on a
# codex/api-* branch, where nb_codex.py fetch picks them up. Replaces the manual Codex step (2026-10-31).
on:
  push:
    branches: [main]
    paths: ["orders/*.md"]
  workflow_dispatch:
concurrency: {group: image-gen, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - name: Draw images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/images/gen_images.py || echo "DRAW_FAILED=1" >> "$GITHUB_ENV"
      - name: Push branch
        run: |
          git add incoming
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name "nookbrief-images-bot"
          git config user.email "actions@github.com"
          b="codex/api-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$b"
          git commit -q -m "images: drawn by OpenAI API for open orders"
          git push -q origin "$b"
          echo "pushed $b"
      - if: env.DRAW_FAILED == '1'
        run: exit 1
